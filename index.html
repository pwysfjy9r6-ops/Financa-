<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#0b1020">
<title>Finanças</title>
<style>
:root{--bg:#0b1020;--card:#151b2e;--card2:#1c2440;--txt:#eef2ff;--mut:#8b95b5;--line:#252e4a;--verde:#34d399;--verm:#fb7185;--azul:#60a5fa;--roxo:#a78bfa;--amar:#fbbf24}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,sans-serif;background:var(--bg);color:var(--txt);padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 96px);min-height:100vh}
.topo{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
.topo button{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);color:var(--txt);font-size:22px}
.topo .mes{text-align:center}
.topo .mes b{display:block;font-size:20px;text-transform:capitalize}
.topo .mes small{color:var(--mut);font-size:12px}
.aba{display:none}.aba.on{display:block}
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed);border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:0 10px 30px rgba(79,70,229,.35)}
.hero small{opacity:.8;font-size:13px}
.hero .big{font-size:36px;font-weight:800;margin:4px 0 12px;letter-spacing:-1px}
.hero .linha{display:flex;justify-content:space-between;font-size:13px;opacity:.95;padding-top:10px;border-top:1px solid rgba(255,255,255,.25)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.mini{background:var(--card);border-radius:16px;padding:14px}
.mini small{color:var(--mut);font-size:12px;display:block}
.mini b{font-size:18px;display:block;margin-top:4px}
.card{background:var(--card);border-radius:18px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center}
.card h2 span{font-size:12px;color:var(--mut);font-weight:400}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-of-type{border-bottom:0}
.chk{appearance:none;-webkit-appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--mut);flex-shrink:0;display:grid;place-content:center;background:transparent}
.chk:checked{background:var(--verde);border-color:var(--verde)}
.chk:checked::after{content:'✓';color:#062;font-weight:900;font-size:15px}
.item .nome{flex:1;min-width:0}
.item .nome div:first-child{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .sub{font-size:12px;color:var(--mut);margin-top:2px}
.item .val{font-weight:600;font-size:15px}
.item.ok .nome div:first-child{text-decoration:line-through;opacity:.45}
.item.ok .val{opacity:.45}
.item.venc{background:rgba(251,113,133,.09);margin:0 -14px;padding:12px 14px;border-left:3px solid var(--verm)}
.item.venc .sub{color:var(--verm);font-weight:600}
.item.hoje .sub{color:var(--amar);font-weight:600}
.del{background:none;border:0;color:var(--mut);font-size:18px;padding:4px}
.pos{color:var(--verde)}.neg{color:var(--verm)}.inv{color:var(--azul)}.cre{color:var(--amar)}
.vazio{color:var(--mut);font-size:13px;padding:10px 0}
.form{display:grid;grid-template-columns:1fr 70px 100px 44px;gap:8px;margin-top:12px}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.form input,.form select,.form2 input,.form2 select{padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:15px;min-width:0;width:100%}
.form button{background:var(--roxo);color:#fff;border:0;border-radius:12px;font-size:22px}
.form2 .full{grid-column:1/3}
.form2 button{background:var(--roxo);color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;grid-column:1/3}
.btn2{background:var(--card);color:var(--txt);border:0;border-radius:14px;padding:14px;width:100%;font-size:14px;margin-bottom:10px}
.barra{height:10px;background:var(--card2);border-radius:6px;overflow:hidden;margin:8px 0}
.barra i{display:block;height:100%;background:var(--verde);border-radius:6px}
.barra i.alerta{background:var(--amar)}.barra i.estouro{background:var(--verm)}
.cat{display:flex;justify-content:space-between;padding:7px 0;font-size:14px}
.diario{text-align:center;padding:6px 0}
.diario .big{font-size:30px;font-weight:800;margin:4px 0}
.diario small{color:var(--mut);font-size:12px}
.tab{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 10px);background:rgba(21,27,46,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;display:flex;padding:8px;border:1px solid var(--line);z-index:5}
.tab button{flex:1;background:none;border:0;color:var(--mut);padding:8px 2px;border-radius:16px;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab button i{font-style:normal;font-size:20px}
.tab button.on{background:var(--card2);color:var(--txt)}
#trava{position:fixed;inset:0;background:var(--bg);z-index:9;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px}
#trava .ico{font-size:48px}
#trava input{font-size:30px;text-align:center;width:180px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--txt);letter-spacing:10px}
#trava button{background:var(--roxo);color:#fff;border:0;border-radius:14px;padding:12px 32px;font-size:16px}
</style>
</head>
<body>

<div id="trava">
  <div class="ico">🔒</div>
  <h1 id="travaTitulo">Digite sua senha</h1>
  <input id="pin" type="password" inputmode="numeric" maxlength="4">
  <button onclick="checarPin()">Entrar</button>
</div>

<div id="app">
  <div class="topo">
    <button onclick="mudarMes(-1)">‹</button>
    <div class="mes"><b id="mesTitulo"></b><small id="mesSub"></small></div>
    <button onclick="mudarMes(1)">›</button>
  </div>

  <section class="aba on" id="aba-resumo">
    <div class="hero" id="hero"></div>
    <div class="card" id="cardDiario"></div>
    <div class="grid" id="grid"></div>
    <div class="card" id="cardCredito"></div>
    <div class="card" id="cardMeta"></div>
    <div class="card" id="cardCats"></div>
    <div class="card" id="alertas"></div>
  </section>

  <section class="aba" id="aba-contas">
    <div class="card">
      <h2>Contas fixas <span id="contasInfo"></span></h2>
      <div id="listaContas"></div>
      <div class="form">
        <input id="cNome" placeholder="Conta">
        <input id="cDia" type="number" min="1" max="31" placeholder="Dia">
        <input id="cValor" type="number" step="0.01" placeholder="Valor">
        <button onclick="addFixo('contas')">+</button>
      </div>
      <div class="form2">
        <input id="cParc" type="number" min="1" max="60" placeholder="Parcelas (opcional)" class="full">
      </div>
    </div>
    <div class="card">
      <h2>Ganhos fixos <span id="ganhosInfo"></span></h2>
      <div id="listaGanhos"></div>
      <div class="form">
        <input id="gNome" placeholder="Ganho">
        <input id="gDia" type="number" min="1" max="31" placeholder="Dia">
        <input id="gValor" type="number" step="0.01" placeholder="Valor">
        <button onclick="addFixo('ganhos')">+</button>
      </div>
    </div>
  </section>

  <section class="aba" id="aba-dia">
    <div class="card">
      <h2>Novo lançamento</h2>
      <div class="form2">
        <input id="dDesc" placeholder="Descrição" class="full">
        <input id="dValor" type="number" step="0.01" placeholder="Valor">
        <select id="dTipo" onchange="ajustaForm()">
          <option value="gasto">Gasto</option>
          <option value="ganho">Ganho</option>
          <option value="investimento">Investimento</option>
        </select>
        <select id="dForma"></select>
        <select id="dCat"></select>
        <button onclick="addDia()">Adicionar</button>
      </div>
    </div>
    <div class="card"><h2>Lançamentos do mês</h2><div id="listaDia"></div></div>
  </section>

  <section class="aba" id="aba-inv">
    <div class="hero" style="background:linear-gradient(135deg,#2563eb,#0ea5e9);box-shadow:0 10px 30px rgba(37,99,235,.35)" id="heroInv"></div>
    <div class="card"><h2>Investimentos do mês</h2><div id="listaInv"></div></div>
  </section>

  <section class="aba" id="aba-mais">
    <div class="card">
      <h2>Meta de gasto do dia a dia</h2>
      <div class="form2">
        <input id="metaVal" type="number" step="0.01" placeholder="Meta mensal (R$)" class="full">
        <button onclick="salvarMeta()">Salvar meta</button>
      </div>
    </div>
    <div class="card">
      <h2>Cartão de crédito</h2>
      <div class="form2">
        <input id="cartFecha" type="number" min="1" max="28" placeholder="Dia de fechamento">
        <input id="cartVence" type="number" min="1" max="28" placeholder="Dia de vencimento">
        <button onclick="salvarCartao()">Salvar cartão</button>
      </div>
    </div>
    <div class="card">
      <h2>Backup dos dados</h2>
      <p class="vazio">Exporte de vez em quando e guarde o arquivo no app Arquivos ou no iCloud.</p>
      <button class="btn2" onclick="exportar()">Exportar backup</button>
      <button class="btn2" onclick="document.getElementById('arq').click()">Importar backup</button>
      <input type="file" id="arq" accept=".json,application/json" style="display:none" onchange="importar(event)">
    </div>
    <div class="card">
      <button class="btn2" onclick="trocarPin()" style="margin:0">Trocar senha</button>
    </div>
  </section>
</div>

<nav class="tab" id="tab">
  <button class="on" onclick="aba('resumo')"><i>🏠</i>Resumo</button>
  <button onclick="aba('contas')"><i>📅</i>Contas</button>
  <button onclick="aba('dia')"><i>✏️</i>Dia a dia</button>
  <button onclick="aba('inv')"><i>📈</i>Investir</button>
  <button onclick="aba('mais')"><i>⚙️</i>Mais</button>
</nav>
<script>
const CH='financas_v1';
let dados=JSON.parse(localStorage.getItem(CH)||'{}');
dados.pin=dados.pin||null;
dados.meses=dados.meses||{};
dados.meta=dados.meta||0;
dados.cartao=dados.cartao||{fecha:7,vence:14};
let atual=new Date();atual.setDate(1);
const ABAS=['resumo','contas','dia','inv','mais'];
const FORMAS_GASTO=['Pix','Débito','Crédito','Dinheiro'];
const FORMAS_GANHO=['Pix','Dinheiro','Transferência'];
const CATS=['Mercado','Transporte','Lazer','Alimentação','Saúde','Casa','Compras','Outros'];

function salvar(){localStorage.setItem(CH,JSON.stringify(dados))}
function chave(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')}
function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function soma(arr){return arr.reduce((s,x)=>s+x.valor,0)}
function esc(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function kMais(k,n){const [a,m]=k.split('-').map(Number);return chave(new Date(a,m-1+n,1))}

function aba(nome){
  ABAS.forEach((a,i)=>{
    document.getElementById('aba-'+a).classList.toggle('on',a===nome);
    document.querySelectorAll('#tab button')[i].classList.toggle('on',a===nome);
  });
  window.scrollTo(0,0);
}

/* ---------- MESES ---------- */
function mesDe(k){
  if(dados.meses[k])return dados.meses[k];
  const kAnt=kMais(k,-1);
  let novo={contas:[],ganhos:[],dia:[]};
  if(dados.meses[kAnt]){
    const p=dados.meses[kAnt];
    /* contas fixas: copia as normais; parceladas só continuam se ainda restam parcelas */
    p.contas.forEach(c=>{
      if(c.fatura)return;
      if(c.total){
        if(c.parc<c.total)novo.contas.push({...c,id:uid(),pago:false,parc:c.parc+1});
      }else novo.contas.push({...c,id:uid(),pago:false});
    });
    novo.ganhos=p.ganhos.map(g=>({...g,id:uid(),recebido:false}));
  }
  dados.meses[k]=novo;salvar();return novo;
}

/* ---------- CARTÃO DE CRÉDITO ---------- */
/* Compra feita no dia d do mês k entra na fatura do mês de vencimento correspondente */
function mesFatura(k,diaCompra){
  /* fechamento dia F: compras até F caem na fatura que fecha neste mês; depois, na do mês seguinte */
  const fechaNesteMes=diaCompra<=dados.cartao.fecha;
  const kFecha=fechaNesteMes?k:kMais(k,1);
  /* vencimento: se vence depois do fechamento, é no mesmo mês do fechamento; senão no seguinte */
  return dados.cartao.vence>dados.cartao.fecha?kFecha:kMais(kFecha,1);
}
function diaDaCompra(d){return d.dataISO?parseInt(d.dataISO.slice(8,10)):1}

/* total de compras no crédito que caem na fatura que vence no mês kv */
function totalFatura(kv){
  let t=0;
  Object.keys(dados.meses).forEach(k=>{
    dados.meses[k].dia.forEach(d=>{
      if(d.tipo==='gasto'&&d.forma==='Crédito'&&mesFatura(k,diaDaCompra(d))===kv)t+=d.valor;
    });
  });
  return t;
}
/* fatura é uma conta a pagar automática; guarda só se foi paga */
function faturaDe(k){
  const mes=mesDe(k);
  let f=mes.contas.find(c=>c.fatura);
  const v=totalFatura(k);
  if(!f&&v<=0)return null;
  if(!f){f={id:uid(),nome:'Fatura do cartão',dia:dados.cartao.vence,valor:v,pago:false,fatura:true};mes.contas.push(f);}
  f.valor=v;f.dia=dados.cartao.vence;
  return f;
}
/* crédito acumulado deste mês = compras no crédito feitas no mês k (vão para faturas futuras) */
function creditoAcumulado(k){
  return soma(mesDe(k).dia.filter(d=>d.tipo==='gasto'&&d.forma==='Crédito'));
}

/* ---------- SALDOS ---------- */
function efeitoDia(d){
  if(d.tipo==='ganho')return d.valor;
  if(d.tipo==='gasto'&&d.forma==='Crédito')return 0; /* crédito não mexe no saldo: vira fatura */
  return -d.valor;
}
function saldoRealFinal(k){
  faturaDe(k);
  const mes=mesDe(k);
  return saldoInicial(k)+soma(mes.ganhos.filter(g=>g.recebido))-soma(mes.contas.filter(c=>c.pago))+mes.dia.reduce((s,d)=>s+efeitoDia(d),0);
}
function previsaoFinal(k){
  faturaDe(k);
  const mes=mesDe(k);
  return saldoInicial(k)+soma(mes.ganhos)-soma(mes.contas)+mes.dia.reduce((s,d)=>s+efeitoDia(d),0);
}
function saldoInicial(k){
  const kAnt=kMais(k,-1);
  if(!dados.meses[kAnt])return 0;
  return saldoRealFinal(kAnt);
}

/* ---------- LIMITE POR DIA ---------- */
function gastoDiaADia(k){
  /* gastos do dia a dia que saem do saldo (exclui crédito e investimento) */
  return soma(mesDe(k).dia.filter(d=>d.tipo==='gasto'&&d.forma!=='Crédito'));
}
function diasRestantes(){
  const h=new Date();
  const ultimo=new Date(atual.getFullYear(),atual.getMonth()+1,0).getDate();
  if(chave(atual)<chave(new Date(h.getFullYear(),h.getMonth(),1)))return 0;
  if(chave(atual)>chave(new Date(h.getFullYear(),h.getMonth(),1)))return ultimo;
  return ultimo-h.getDate()+1;
}

/* ---------- VENCIMENTOS ---------- */
function situacao(dia){
  const h=new Date();
  const k=chave(atual),kh=chave(new Date(h.getFullYear(),h.getMonth(),1));
  if(k<kh)return 'venc';
  if(k>kh)return 'prox';
  if(dia<h.getDate())return 'venc';
  if(dia===h.getDate())return 'hoje';
  return 'prox';
}

function mudarMes(n){atual.setMonth(atual.getMonth()+n);render()}

/* ---------- AÇÕES ---------- */
function addFixo(tipo){
  const p=tipo==='contas'?'c':'g';
  const nome=document.getElementById(p+'Nome').value.trim();
  const dia=parseInt(document.getElementById(p+'Dia').value);
  const valor=parseFloat(document.getElementById(p+'Valor').value);
  if(!nome||!dia||dia<1||dia>31||isNaN(valor))return alert('Preencha nome, dia (1 a 31) e valor.');
  const mes=mesDe(chave(atual));
  if(tipo==='contas'){
    const total=parseInt(document.getElementById('cParc').value)||0;
    const c={id:uid(),nome,dia,valor,pago:false};
    if(total>1){c.total=total;c.parc=1;}
    mes.contas.push(c);
    document.getElementById('cParc').value='';
  }else mes.ganhos.push({id:uid(),nome,dia,valor,recebido:false});
  ['Nome','Dia','Valor'].forEach(x=>document.getElementById(p+x).value='');
  salvar();render();
}

function ajustaForm(){
  const t=document.getElementById('dTipo').value;
  const f=document.getElementById('dForma'),c=document.getElementById('dCat');
  const lista=t==='ganho'?FORMAS_GANHO:(t==='investimento'?['Pix','Transferência']:FORMAS_GASTO);
  f.innerHTML=lista.map(x=>`<option>${x}</option>`).join('');
  c.innerHTML=t==='gasto'?CATS.map(x=>`<option>${x}</option>`).join(''):'<option>—</option>';
  c.style.display=t==='gasto'?'block':'none';
}

function addDia(){
  const desc=document.getElementById('dDesc').value.trim();
  const valor=parseFloat(document.getElementById('dValor').value);
  const tipo=document.getElementById('dTipo').value;
  const forma=document.getElementById('dForma').value;
  const cat=tipo==='gasto'?document.getElementById('dCat').value:'';
  if(!desc||isNaN(valor))return alert('Preencha descrição e valor.');
  const h=new Date();
  /* o lançamento vai para o mês que está na tela; a data do dia é a de hoje se for o mês atual, senão dia 1 */
  const mesmoMes=chave(atual)===chave(h);
  const dia=mesmoMes?h.getDate():1;
  const iso=chave(atual)+'-'+String(dia).padStart(2,'0');
  mesDe(chave(atual)).dia.push({id:uid(),desc,valor,tipo,forma,cat,data:String(dia).padStart(2,'0')+'/'+chave(atual).slice(5)+'/'+chave(atual).slice(0,4),dataISO:iso});
  document.getElementById('dDesc').value='';document.getElementById('dValor').value='';
  salvar();render();
}

function marcar(lista,id){
  const it=mesDe(chave(atual))[lista].find(x=>x.id===id);
  if(lista==='contas')it.pago=!it.pago;else it.recebido=!it.recebido;
  salvar();render();
}
function remover(lista,id){
  const mes=mesDe(chave(atual));
  const it=mes[lista].find(x=>x.id===id);
  if(it&&it.fatura)return alert('A fatura é calculada sozinha a partir das compras no crédito. Apague as compras para mudar o valor.');
  if(!confirm('Remover este item?'))return;
  mes[lista]=mes[lista].filter(x=>x.id!==id);
  salvar();render();
}
function totalInvestido(){
  let t=0;
  Object.values(dados.meses).forEach(m=>{t+=soma(m.dia.filter(d=>d.tipo==='investimento'))});
  return t;
}

function salvarMeta(){
  const v=parseFloat(document.getElementById('metaVal').value);
  if(isNaN(v)||v<0)return alert('Digite um valor válido.');
  dados.meta=v;salvar();render();alert('Meta salva.');
}
function salvarCartao(){
  const f=parseInt(document.getElementById('cartFecha').value),v=parseInt(document.getElementById('cartVence').value);
  if(!f||!v||f<1||f>28||v<1||v>28)return alert('Use dias de 1 a 28.');
  dados.cartao={fecha:f,vence:v};salvar();render();alert('Cartão salvo.');
}

/* ---------- BACKUP ---------- */
function exportar(){
  const blob=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='backup-financas-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importar(ev){
  const f=ev.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.meses)throw 0;
      if(!confirm('Isso substitui os dados atuais pelos do backup. Continuar?'))return;
      dados=d;dados.meta=dados.meta||0;dados.cartao=dados.cartao||{fecha:7,vence:14};
      salvar();render();alert('Backup restaurado.');
    }catch(e){alert('Arquivo inválido.')}
  };
  r.readAsText(f);
}

/* ---------- TELA ---------- */
function linhaFixa(x,lista,okCampo,txtOk,txtPend,corVal){
  const feito=x[okCampo];
  const s=feito?'ok':situacao(x.dia);
  const cls=feito?'ok':(s==='venc'?'venc':(s==='hoje'?'hoje':''));
  let sub;
  if(feito)sub=`dia ${x.dia} · ${txtOk}`;
  else if(s==='venc')sub=`dia ${x.dia} · ${lista==='contas'?'VENCIDA':'ATRASADO'} — ${txtPend}`;
  else if(s==='hoje')sub=`dia ${x.dia} · É HOJE — ${txtPend}`;
  else sub=`dia ${x.dia} · ${txtPend}`;
  const parc=x.total?` (${x.parc}/${x.total})`:'';
  return `<div class="item ${cls}">
    <input class="chk" type="checkbox" ${feito?'checked':''} onchange="marcar('${lista}','${x.id}')">
    <div class="nome"><div>${esc(x.nome)}${parc}</div><div class="sub">${sub}</div></div>
    <div class="val ${corVal}">${brl(x.valor)}</div>
    <button class="del" onclick="remover('${lista}','${x.id}')">✕</button>
  </div>`;
}

function render(){
  const k=chave(atual);
  faturaDe(k);
  const mes=mesDe(k);
  document.getElementById('mesTitulo').textContent=atual.toLocaleDateString('pt-BR',{month:'long'});
  document.getElementById('mesSub').textContent=atual.getFullYear();

  const ini=saldoInicial(k);
  const ganPrev=soma(mes.ganhos),conPrev=soma(mes.contas);
  const ganReal=soma(mes.ganhos.filter(g=>g.recebido)),conReal=soma(mes.contas.filter(c=>c.pago));
  const dia=mes.dia.reduce((s,d)=>s+efeitoDia(d),0);
  const real=saldoRealFinal(k),prev=previsaoFinal(k);

  document.getElementById('hero').innerHTML=
   `<small>Saldo atual</small>
    <div class="big">${brl(real)}</div>
    <div class="linha"><span>Sobra prevista no fim do mês</span><b>${brl(prev)}</b></div>`;

  /* limite por dia: o que sobra para gastar (previsão), dividido pelos dias que faltam */
  const dr=diasRestantes();
  const livre=prev;
  const porDia=dr>0?livre/dr:0;
  document.getElementById('cardDiario').innerHTML=
   `<div class="diario"><small>Você pode gastar por dia</small>
    <div class="big ${porDia<0?'neg':'pos'}">${brl(Math.max(porDia,0)===0&&porDia<0?porDia:porDia)}</div>
    <small>${dr>0?`${dr} dias restantes no mês · considera tudo que ainda vai pagar e receber`:'Este mês já terminou'}</small></div>`;

  document.getElementById('grid').innerHTML=
   `<div class="mini"><small>Saldo inicial</small><b class="${ini<0?'neg':''}">${brl(ini)}</b></div>
    <div class="mini"><small>Dia a dia (líquido)</small><b class="${dia<0?'neg':'pos'}">${brl(dia)}</b></div>
    <div class="mini"><small>Recebido</small><b class="pos">${brl(ganReal)}</b></div>
    <div class="mini"><small>Pago</small><b class="neg">${brl(conReal)}</b></div>
    <div class="mini"><small>Ainda a receber</small><b class="pos">${brl(ganPrev-ganReal)}</b></div>
    <div class="mini"><small>Ainda a pagar</small><b class="neg">${brl(conPrev-conReal)}</b></div>`;

  /* crédito acumulado */
  const cred=creditoAcumulado(k);
  const kv=mesFatura(k,dados.cartao.fecha+1);
  document.getElementById('cardCredito').innerHTML=
   `<h2>💳 Cartão de crédito <span>fecha dia ${dados.cartao.fecha} · vence dia ${dados.cartao.vence}</span></h2>
    <div class="cat"><span>Gasto no crédito neste mês</span><b class="cre">${brl(cred)}</b></div>
    <div class="vazio">Não mexe no saldo. Entra como "Fatura do cartão" nas contas do mês em que vencer.</div>`;

  /* meta mensal */
  const gasto=gastoDiaADia(k)+soma(mes.dia.filter(d=>d.tipo==='gasto'&&d.forma==='Crédito'));
  const meta=dados.meta;
  if(meta>0){
    const pct=Math.min(gasto/meta*100,100);
    const cl=gasto>meta?'estouro':(gasto>=meta*0.8?'alerta':'');
    const aviso=gasto>meta?`<div class="neg" style="font-size:13px">Você passou da meta em ${brl(gasto-meta)}.</div>`:(gasto>=meta*0.8?`<div class="cre" style="font-size:13px">Atenção: você já usou ${Math.round(gasto/meta*100)}% da meta.</div>`:`<div class="vazio" style="padding:0">Ainda restam ${brl(meta-gasto)}.</div>`);
    document.getElementById('cardMeta').innerHTML=
     `<h2>🎯 Meta do mês <span>${brl(gasto)} de ${brl(meta)}</span></h2>
      <div class="barra"><i class="${cl}" style="width:${pct}%"></i></div>${aviso}`;
  }else document.getElementById('cardMeta').innerHTML='<h2>🎯 Meta do mês</h2><div class="vazio">Defina uma meta na aba Mais.</div>';

  /* categorias */
  const porCat={};
  mes.dia.filter(d=>d.tipo==='gasto').forEach(d=>{const c=d.cat||'Outros';porCat[c]=(porCat[c]||0)+d.valor});
  const ent=Object.entries(porCat).sort((a,b)=>b[1]-a[1]);
  document.getElementById('cardCats').innerHTML='<h2>📊 Gastos por categoria</h2>'+(ent.length?ent.map(([c,v])=>`<div class="cat"><span>${esc(c)}</span><b>${brl(v)}</b></div>`).join(''):'<div class="vazio">Nenhum gasto neste mês.</div>');

  /* alertas */
  const vencContas=mes.contas.filter(c=>!c.pago&&situacao(c.dia)==='venc');
  const hojeContas=mes.contas.filter(c=>!c.pago&&situacao(c.dia)==='hoje');
  const vencGanhos=mes.ganhos.filter(g=>!g.recebido&&situacao(g.dia)==='venc');
  let al='<h2>⚠️ Atenção</h2>';
  vencContas.forEach(c=>al+=`<div class="item venc"><div class="nome"><div>${esc(c.nome)}</div><div class="sub">VENCIDA no dia ${c.dia}</div></div><div class="val neg">${brl(c.valor)}</div></div>`);
  hojeContas.forEach(c=>al+=`<div class="item hoje"><div class="nome"><div>${esc(c.nome)}</div><div class="sub">Vence hoje</div></div><div class="val">${brl(c.valor)}</div></div>`);
  vencGanhos.forEach(g=>al+=`<div class="item hoje"><div class="nome"><div>${esc(g.nome)}</div><div class="sub">Era para cair no dia ${g.dia}. Já recebeu?</div></div><div class="val pos">${brl(g.valor)}</div></div>`);
  if(!vencContas.length&&!hojeContas.length&&!vencGanhos.length)al+='<div class="vazio">Tudo em dia por aqui. 🎉</div>';
  document.getElementById('alertas').innerHTML=al;

  /* contas e ganhos */
  const ord=(a,b)=>a.dia-b.dia;
  document.getElementById('contasInfo').textContent=`${mes.contas.filter(c=>c.pago).length}/${mes.contas.length} pagas`;
  document.getElementById('ganhosInfo').textContent=`${mes.ganhos.filter(g=>g.recebido).length}/${mes.ganhos.length} recebidos`;
  document.getElementById('listaContas').innerHTML=[...mes.contas].sort(ord).map(c=>linhaFixa(c,'contas','pago','pago','a pagar','')).join('')||'<div class="vazio">Nenhuma conta cadastrada.</div>';
  document.getElementById('listaGanhos').innerHTML=[...mes.ganhos].sort(ord).map(g=>linhaFixa(g,'ganhos','recebido','recebido','a receber','pos')).join('')||'<div class="vazio">Nenhum ganho cadastrado.</div>';

  /* dia a dia */
  const cor=d=>d.tipo==='ganho'?'pos':(d.tipo==='investimento'?'inv':(d.forma==='Crédito'?'cre':'neg'));
  const sinal=t=>t==='ganho'?'+':'-';
  document.getElementById('listaDia').innerHTML=[...mes.dia].reverse().map(d=>
   `<div class="item">
      <div class="nome"><div>${esc(d.desc)}</div><div class="sub">${d.data} · ${d.tipo}${d.forma?' · '+d.forma:''}${d.cat?' · '+esc(d.cat):''}</div></div>
      <div class="val ${cor(d)}">${sinal(d.tipo)}${brl(d.valor)}</div>
      <button class="del" onclick="remover('dia','${d.id}')">✕</button>
    </div>`).join('')||'<div class="vazio">Nada lançado neste mês.</div>';

  /* investimentos */
  const invMes=mes.dia.filter(d=>d.tipo==='investimento');
  document.getElementById('heroInv').innerHTML=
   `<small>Total guardado</small>
    <div class="big">${brl(totalInvestido())}</div>
    <div class="linha"><span>Investido neste mês</span><b>${brl(soma(invMes))}</b></div>`;
  document.getElementById('listaInv').innerHTML=[...invMes].reverse().map(d=>
   `<div class="item">
      <div class="nome"><div>${esc(d.desc)}</div><div class="sub">${d.data} · ${d.forma}</div></div>
      <div class="val inv">${brl(d.valor)}</div>
      <button class="del" onclick="remover('dia','${d.id}')">✕</button>
    </div>`).join('')||'<div class="vazio">Nenhum investimento neste mês. Lance pela aba Dia a dia.</div>';

  document.getElementById('metaVal').value=dados.meta||'';
  document.getElementById('cartFecha').value=dados.cartao.fecha;
  document.getElementById('cartVence').value=dados.cartao.vence;
}

/* ---------- SENHA ---------- */
function mostrarTrava(){
  document.getElementById('trava').style.display='flex';
  document.getElementById('app').style.display='none';
  document.getElementById('tab').style.display='none';
  document.getElementById('travaTitulo').textContent=dados.pin?'Digite sua senha':'Crie uma senha de 4 dígitos';
}
function checarPin(){
  const v=document.getElementById('pin').value;
  if(v.length!==4)return alert('Use 4 dígitos.');
  if(!dados.pin){dados.pin=v;salvar();}
  else if(dados.pin!==v){document.getElementById('pin').value='';return alert('Senha incorreta.');}
  document.getElementById('pin').value='';
  document.getElementById('trava').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('tab').style.display='flex';
  ajustaForm();render();
}
function trocarPin(){
  const n=prompt('Nova senha de 4 dígitos:');
  if(n&&/^\d{4}$/.test(n)){dados.pin=n;salvar();alert('Senha alterada.');}
  else if(n!==null)alert('A senha precisa ter 4 números.');
}

mostrarTrava();
</script>
